
name: Build OpenCode Desktop Portable Windows

'on':
  workflow_dispatch:
    inputs:
      source_ref:
        description: Source branch or tag
        required: true
        default: dev
        type: string

permissions:
  contents: write

concurrency:
  group: opencode-portable-windows
  cancel-in-progress: true

jobs:
  build:
    name: Build Windows x64 Portable
    runs-on: windows-latest
    timeout-minutes: 90

    env:
      OPENCODE_CHANNEL: dev
      OPENCODE_TARGET: windows-x64

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref }}
          fetch-depth: 1

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          bun install --frozen-lockfile

          if ($LASTEXITCODE -ne 0) {
            throw "Bun dependency installation failed."
          }

      - name: Apply portable mode
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $configure = "packages/desktop/src/main/lifecycle/configure.ts"
          $source = [IO.File]::ReadAllText($configure).Replace("`r`n", "`n")

          $pattern = '(?ms)^  const testRoot = createTestRoot\(\)\n.*?^  // Reads the settings store, so it runs once userData is set\.\n'
          $regex = [regex]::new($pattern)

          if ($regex.Matches($source).Count -ne 1) {
            throw "Could not uniquely locate the userData section in configure.ts."
          }

          $replacement = @'
          const testRoot = createTestRoot()
          const portableRoot = app.isPackaged && !testRoot ? path.dirname(process.execPath) : undefined

          if (portableRoot) {
            const portableData = path.join(portableRoot, "DATA")
            const dirs = {
              config: path.join(portableData, "config"),
              data: path.join(portableData, "data"),
              cache: path.join(portableData, "cache"),
              state: path.join(portableData, "state"),
              desktop: path.join(portableData, "desktop"),
              session: path.join(portableData, "session"),
              appData: path.join(portableData, "appdata"),
              roaming: path.join(portableData, "roaming"),
              local: path.join(portableData, "local"),
              temp: path.join(portableData, "temp"),
            }

            for (const dir of Object.values(dirs)) {
              mkdirSync(dir, { recursive: true })
            }

            Object.assign(process.env, {
              OPENCODE_PORTABLE_HOME: portableData,
              XDG_CONFIG_HOME: dirs.config,
              XDG_DATA_HOME: dirs.data,
              XDG_CACHE_HOME: dirs.cache,
              XDG_STATE_HOME: dirs.state,
              APPDATA: dirs.roaming,
              LOCALAPPDATA: dirs.local,
              TEMP: dirs.temp,
              TMP: dirs.temp,
            })

            app.setPath("appData", dirs.appData)
            app.setPath("userData", dirs.desktop)
            app.setPath("sessionData", dirs.session)
            app.setPath("temp", dirs.temp)
          } else {
            const customUserData = debugBuild(build) && !testRoot ? process.env.OPENCODE_DESKTOP_USER_DATA : undefined
            app.setPath(
              "userData",
              customUserData ?? (testRoot ? path.join(testRoot, "desktop") : path.join(app.getPath("appData"), APP_ID)),
            )

            if (customUserData) {
              app.setPath("sessionData", path.join(customUserData, "session"))
            }
          }

          // Reads the settings store, so it runs once userData is set.
          '@

          $source = $regex.Replace(
            $source,
            [System.Text.RegularExpressions.MatchEvaluator]{
              param($match)
              return $replacement
            },
            1
          )

          [IO.File]::WriteAllText(
            $configure,
            $source,
            [System.Text.UTF8Encoding]::new($false)
          )

          $environment = "packages/desktop/src/main/lifecycle/environment.ts"
          $envSource = [IO.File]::ReadAllText($environment).Replace("`r`n", "`n")

          $envPattern = '(?m)^(\s*)if \(!shellEnv\?\.XDG_STATE_HOME\) delete process\.env\.XDG_STATE_HOME$'
          $envRegex = [regex]::new($envPattern)

          if ($envRegex.Matches($envSource).Count -ne 1) {
            throw "Could not locate XDG_STATE_HOME cleanup in environment.ts."
          }

          $envSource = $envRegex.Replace(
            $envSource,
            [System.Text.RegularExpressions.MatchEvaluator]{
              param($match)
              return $match.Groups[1].Value + 'if (!shellEnv?.XDG_STATE_HOME && !process.env.OPENCODE_PORTABLE_HOME) delete process.env.XDG_STATE_HOME'
            },
            1
          )

          [IO.File]::WriteAllText(
            $environment,
            $envSource,
            [System.Text.UTF8Encoding]::new($false)
          )

          Write-Host "Portable mode patch completed."

      - name: Prepare desktop packaging
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          # The portable build does not need an updater feed.
          # Skip the upstream update-config generation for the dev channel.
          $packScript = "packages/desktop/script/pack.ts"
          $source = [IO.File]::ReadAllText($packScript).Replace("`r`n", "`n")

          $pattern = '(?m)^  await writeUpdateConfig\(path\.join\(unpacked, "resources"\)\)\n'
          $regex = [regex]::new($pattern)

          if ($regex.Matches($source).Count -ne 1) {
            throw "Could not uniquely locate the Windows update-config generation in pack.ts."
          }

          $source = $regex.Replace($source, "", 1)

          [IO.File]::WriteAllText(
            $packScript,
            $source,
            [System.Text.UTF8Encoding]::new($false)
          )

          Write-Host "Portable packaging preparation completed."

      - name: Build Desktop
        shell: pwsh
        working-directory: packages/desktop
        run: |
          $ErrorActionPreference = "Stop"

          bun run build

          if ($LASTEXITCODE -ne 0) {
            throw "Desktop build failed."
          }

          bun run pack

          if ($LASTEXITCODE -ne 0) {
            throw "Desktop packaging failed."
          }

      - name: Assemble portable ZIP
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $appDir = Join-Path $env:GITHUB_WORKSPACE "dist/desktop/app"

          if (-not (Test-Path -LiteralPath $appDir -PathType Container)) {
            Write-Host "Desktop output directory not found."
            Write-Host "Available dist contents:"

            if (Test-Path "dist") {
              Get-ChildItem "dist" -Force -Recurse |
                Select-Object -First 100 FullName
            }

            throw "Missing expected desktop directory: $appDir"
          }

          # Validate Electron's actual packaged application resources.
          $asar = Join-Path $appDir "resources/app.asar"

          if (-not (Test-Path -LiteralPath $asar -PathType Leaf)) {
            Write-Host "Application directory contents:"
            Get-ChildItem -LiteralPath $appDir -Force -Recurse |
              Select-Object -First 100 FullName

            throw "resources/app.asar was not found. Desktop packaging is incomplete."
          }

          Write-Host "Application resources verified."

          # Display executable names without assuming a fixed product name.
          Write-Host "Executable files:"
          Get-ChildItem -LiteralPath $appDir -File -Filter "*.exe" |
            ForEach-Object {
              Write-Host $_.Name
            }

          # Create portable directories.
          $dataDir = Join-Path $appDir "DATA"
          $binDir = Join-Path $appDir "BIN"

          New-Item -ItemType Directory -Force -Path $dataDir | Out-Null
          New-Item -ItemType Directory -Force -Path $binDir | Out-Null

          Set-Content `
            -Path (Join-Path $dataDir ".keep") `
            -Value "Portable application data" `
            -Encoding utf8

          Set-Content `
            -Path (Join-Path $binDir ".keep") `
            -Value "Optional portable tools" `
            -Encoding utf8

          # Remove any updater configuration if present.
          $updateConfig = Join-Path $appDir "resources/app-update.yml"

          if (Test-Path -LiteralPath $updateConfig) {
            Remove-Item -LiteralPath $updateConfig -Force
          }

          # Create ZIP archive.
          $zipPath = Join-Path $env:GITHUB_WORKSPACE "dist/OpenCode-Portable-Windows-x64.zip"

          if (Test-Path -LiteralPath $zipPath) {
            Remove-Item -LiteralPath $zipPath -Force
          }

          Compress-Archive `
            -Path (Join-Path $appDir "*") `
            -DestinationPath $zipPath `
            -CompressionLevel Optimal

          if (-not (Test-Path -LiteralPath $zipPath -PathType Leaf)) {
            throw "Portable ZIP creation failed."
          }

          $zip = Get-Item -LiteralPath $zipPath

          Write-Host "Portable ZIP created successfully."
          Write-Host "ZIP path: $($zip.FullName)"
          Write-Host "ZIP size: $([math]::Round($zip.Length / 1MB, 2)) MB"

      - name: Publish portable Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: portable-latest
          target_commitish: ${{ github.sha }}
          name: OpenCode Desktop Portable Windows x64
          body: |
            OpenCode Desktop portable Windows x64 build.

            - Extract the ZIP and run the desktop executable.
            - Portable data directory: DATA
            - Optional tools directory: BIN
            - No official installer.
            - Automatic update feed configuration removed.

            Source: ${{ inputs.source_ref }}
            Commit: ${{ github.sha }}
          files: dist/OpenCode-Portable-Windows-x64.zip
          overwrite_files: true
          draft: false
          prerelease: true
          make_latest: false

      - name: Build summary
        shell: pwsh
        run: |
          $download = "https://github.com/${{ github.repository }}/releases/download/portable-latest/OpenCode-Portable-Windows-x64.zip"

          @"
          ## OpenCode Desktop Portable

          Build completed.

          Source: ${{ inputs.source_ref }}

          Commit: ${{ github.sha }}

          Download:

          $download
          "@ | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8
