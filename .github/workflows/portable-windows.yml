
      - name: Assemble portable ZIP
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $appDir = Join-Path $env:GITHUB_WORKSPACE "dist/desktop/app"

          # Verify the actual output directory.
          if (-not (Test-Path -LiteralPath $appDir -PathType Container)) {
            Write-Host "Desktop output directory was not found."
            Write-Host "Available desktop output:"
            if (Test-Path "dist/desktop") {
              Get-ChildItem "dist/desktop" -Force -Recurse |
                Select-Object -First 80 FullName
            }
            throw "Expected unpacked application directory: $appDir"
          }

          # Find the actual Electron application executable.
          # Do not assume it is named OpenCode.exe.
          $executables = @(
            Get-ChildItem -LiteralPath $appDir -File -Filter "*.exe" |
              Where-Object {
                $_.Name -notmatch '^(opencode-cli|uninstall|elevate)\.exe$'
              }
          )

          if ($executables.Count -ne 1) {
            Write-Host "Executable candidates found:"
            $executables | ForEach-Object {
              Write-Host $_.FullName
            }

            Write-Host "All EXE files under the application directory:"
            Get-ChildItem -LiteralPath $appDir -Recurse -File -Filter "*.exe" |
              ForEach-Object {
                Write-Host $_.FullName
              }

            throw "Expected exactly one main application EXE in $appDir, found $($executables.Count)."
          }

          $mainExe = $executables[0]
          Write-Host "Main application executable: $($mainExe.Name)"

          # Remove the updater feed configuration.
          $updateConfig = Join-Path $appDir "resources/app-update.yml"

          if (Test-Path -LiteralPath $updateConfig) {
            Remove-Item -LiteralPath $updateConfig -Force
            Write-Host "Removed app-update.yml."
          }

          # Create portable data and optional tools directories.
          $dataDir = Join-Path $appDir "DATA"
          $binDir = Join-Path $appDir "BIN"

          New-Item -ItemType Directory -Force -Path $dataDir | Out-Null
          New-Item -ItemType Directory -Force -Path $binDir | Out-Null

          Set-Content -Path (Join-Path $dataDir ".keep") `
            -Value "Portable application data" -Encoding utf8

          Set-Content -Path (Join-Path $binDir ".keep") `
            -Value "Optional portable tools" -Encoding utf8

          # Create ZIP.
          $zipDir = Join-Path $env:GITHUB_WORKSPACE "dist"
          $zipPath = Join-Path $zipDir "OpenCode-Portable-Windows-x64.zip"

          if (Test-Path -LiteralPath $zipPath) {
            Remove-Item -LiteralPath $zipPath -Force
          }

          Compress-Archive `
            -Path (Join-Path $appDir "*") `
            -DestinationPath $zipPath `
            -CompressionLevel Optimal

          if (-not (Test-Path -LiteralPath $zipPath)) {
            throw "Portable ZIP creation failed."
          }

          $zip = Get-Item -LiteralPath $zipPath

          Write-Host "Portable ZIP created successfully."
          Write-Host "Application EXE: $($mainExe.Name)"
          Write-Host "ZIP: $($zip.FullName)"
          Write-Host "Size: $([math]::Round($zip.Length / 1MB, 2)) MB"
