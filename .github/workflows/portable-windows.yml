
name: OpenCode Portable Windows

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: "Official source branch or commit"
        required: true
        default: "dev"
        type: string

permissions:
  contents: write

concurrency:
  group: opencode-portable-windows
  cancel-in-progress: false

jobs:
  build:
    name: Build Windows x64 Portable
    runs-on: windows-latest
    timeout-minutes: 90

    env:
      OPENCODE_CHANNEL: dev
      OPENCODE_TARGET: windows-x64

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref }}
          fetch-depth: 1

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build and package Desktop
        working-directory: packages/desktop
        shell: pwsh
        run: |
          bun run build
          if ($LASTEXITCODE -ne 0) {
            throw "Desktop build failed"
          }

          bun run pack
          if ($LASTEXITCODE -ne 0) {
            throw "Desktop packaging failed"
          }

      - name: Prepare portable ZIP
        shell: pwsh
        run: |
          $appDir = "dist/desktop/app"
          $releaseDir = "release"
          $zipPath = "$releaseDir/OpenCode-Portable-Windows-x64.zip"

          if (!(Test-Path $appDir)) {
            throw "Portable application directory not found: $appDir"
          }

          $exe = Get-ChildItem $appDir -Filter "*.exe" -File -Recurse |
            Select-Object -First 1

          if (!$exe) {
            throw "No executable found in portable application directory"
          }

          New-Item -ItemType Directory -Force -Path $releaseDir |
            Out-Null

          Compress-Archive `
            -Path "$appDir/*" `
            -DestinationPath $zipPath `
            -CompressionLevel Optimal

          if (!(Test-Path $zipPath)) {
            throw "ZIP creation failed"
          }

          $size = (Get-Item $zipPath).Length / 1MB

          Write-Host "Executable: $($exe.FullName)"
          Write-Host "ZIP size: $([math]::Round($size, 2)) MB"

      - name: Upload Actions artifact
        uses: actions/upload-artifact@v4
        with:
          name: OpenCode-Portable-Windows-x64
          path: release/OpenCode-Portable-Windows-x64.zip
          if-no-files-found: error
          retention-days: 14

      - name: Publish latest portable release
        id: publish
        uses: softprops/action-gh-release@v3
        with:
          tag_name: portable-latest
          target_commitish: ${{ github.sha }}
          name: OpenCode Portable Windows (Latest)
          body: |
            Self-built OpenCode Desktop Portable for Windows x64.

            Source branch: ${{ inputs.source_ref }}
            Source commit: ${{ github.sha }}

            Download the ZIP, extract it and run OpenCode.exe.

            This release is automatically updated by GitHub Actions.
          files: release/OpenCode-Portable-Windows-x64.zip
          overwrite_files: true
          fail_on_unmatched_files: true
          prerelease: false
          make_latest: true

      - name: Write download links
        shell: pwsh
        run: |
          $repo = "${{ github.repository }}"
          $download = "https://github.com/$repo/releases/latest/download/OpenCode-Portable-Windows-x64.zip"
          $release = "https://github.com/$repo/releases/tag/portable-latest"

          @"
          ## OpenCode Portable Windows

          <a href="$download">Download latest Windows x64 Portable ZIP</a>

          **Source:** `${{ inputs.source_ref }}`
          **Commit:** `${{ github.sha }}`

          [View Release]($release)
          "@ | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
